name: WordPress isolated Linux rehearsal build

on:
  workflow_dispatch:
  push:
    branches: ['docs/wordpress-delivery-feasibility-2026-11-02', 'codex/first-operational-cycle-2026-11-12']
    paths:
      - 'proxy.ts'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'instrumentation.ts'
      - 'scripts/wordpress-rehearsal-artifact.mjs'
      - 'scripts/wordpress-artifact-links.mjs'
      - 'scripts/wordpress-private-server.cjs'
      - 'scripts/wordpress-private-listener.cjs'
      - 'scripts/intake/c0-site-journey-client.tsx'
      - 'scripts/intake/presence-workflow-panel.tsx'
      - 'scripts/intake/protected-presence-worker.ts'
      - 'scripts/intake/*presence-evaluation*.ts'
      - 'docs/presence-evaluation-activation.json'
      - 'tests/integration/presence-evaluation*.test.ts'
      - 'scripts/backup/disposable-cluster.ts'
      - 'scripts/db/bootstrap.ts'
      - 'scripts/db/protected-account-*.ts'
      - 'tests/integration/protected-account.test.ts'
      - 'tests/presence-workflow-provider.test.tsx'
      - 'tests/presence-workflow-review.test.tsx'
      - 'tests/protected-workflow-footprint.test.tsx'
      - 'scripts/wordpress-routing-smoke.mjs'
      - 'tests/wordpress-private-server.test.mjs'
      - 'tests/wordpress-private-build-config.test.tsx'
      - 'tests/wordpress-artifact-links.test.mjs'
      - '.github/workflows/wordpress-rehearsal-build.yml'

permissions:
  contents: read

concurrency:
  group: wordpress-rehearsal-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Select protected Core build for manual dispatch
        run: |
          if [ "$GITHUB_REF_NAME" = codex/first-operational-cycle-2026-11-12 ]; then
            echo "MIOPAGES_PROTECTED_CORE=enabled" >> "$GITHUB_ENV"
          else
            echo "MIOPAGES_WP_PRIVATE_STAGE=enabled" >> "$GITHUB_ENV"
          fi
      - name: Reject production dependency advisories
        run: npm audit --omit=dev --audit-level=low
      - name: Verify retained approved rendering on Linux
        run: npx tsx --test tests/proposal-preview-compatibility.test.tsx tests/wordpress-private-build-config.test.tsx
      - name: Verify metered planning and private recovery on Linux
        run: npx tsx --test tests/site-planning.test.tsx tests/site-planning-recovery.test.tsx tests/presence-workflow-provider.test.tsx tests/presence-workflow-review.test.tsx tests/protected-workflow-footprint.test.tsx tests/protected-owner-verification.test.tsx
      - name: Verify isolated evaluation worker on Linux PostgreSQL
        run: |
          for candidate in /usr/lib/postgresql/17/bin /usr/lib/postgresql/18/bin; do
            if test -x "$candidate/initdb"; then export PG_BIN_DIR="$candidate"; break; fi
          done
          if test -z "${PG_BIN_DIR:-}"; then
            sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
            curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
            echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/miopages-pgdg.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-17
            export PG_BIN_DIR=/usr/lib/postgresql/17/bin
          fi
          node --import tsx --test --test-concurrency=1 tests/integration/presence-evaluation-linux.test.ts tests/integration/presence-evaluation.test.ts
      - name: Verify protected account policy and connected local cycle on Linux
        run: |
          export PG_BIN_DIR=/usr/lib/postgresql/17/bin
          if test -x /usr/lib/postgresql/18/bin/initdb; then export PG_BIN_DIR=/usr/lib/postgresql/18/bin; fi
          node --import tsx --test --test-concurrency=1 tests/integration/protected-account.test.ts tests/integration/knowledge-reassessment.test.ts tests/integration/inquiry-outcomes.test.ts
      - name: Verify portable artifact dependency boundary
        run: node --test tests/wordpress-artifact-links.test.mjs
      - name: Verify raw routing boundary and sanitized diagnostics
        run: node --test tests/wordpress-private-server.test.mjs
      - name: Build without hosted credentials
        run: npm run build -- --webpack
        env:
          DATABASE_URL: postgresql://build:unused@127.0.0.1:1/build_only
          MIOPAGES_ROUTING_MODE: shared-hostnames
      - name: Prove isolated runtime and package checksummed artifact
        run: node scripts/wordpress-rehearsal-artifact.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'codex/first-operational-cycle-2026-11-12' && 'protected-core-linux-x64' || 'wordpress-rehearsal-linux-x64' }}
          path: |
            runtime-content/wordpress-rehearsal-artifact/*.tar.gz
            runtime-content/wordpress-rehearsal-artifact/miopages-delivery-development.zip
            runtime-content/wordpress-rehearsal-artifact/*.sha256
            runtime-content/wordpress-rehearsal-artifact/rehearsal-build.json
          if-no-files-found: error
          retention-days: 7

