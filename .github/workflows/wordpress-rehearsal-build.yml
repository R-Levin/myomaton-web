name: WordPress isolated Linux rehearsal build

on:
  push:
    branches: ['docs/wordpress-delivery-feasibility-2026-11-02']
    paths:
      - 'proxy.ts'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'scripts/wordpress-rehearsal-artifact.mjs'
      - '.github/workflows/wordpress-rehearsal-build.yml'

permissions:
  contents: read

concurrency:
  group: wordpress-rehearsal-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Build without hosted credentials
        run: npm run build
        env:
          DATABASE_URL: postgresql://build:unused@127.0.0.1:1/build_only
      - name: Prove isolated runtime and package checksummed artifact
        run: node scripts/wordpress-rehearsal-artifact.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wordpress-rehearsal-linux-x64
          path: |
            runtime-content/wordpress-rehearsal-artifact/*.tar.gz
            runtime-content/wordpress-rehearsal-artifact/*.sha256
            runtime-content/wordpress-rehearsal-artifact/rehearsal-build.json
          if-no-files-found: error
          retention-days: 7
