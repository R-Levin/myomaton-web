name: WordPress isolated Linux rehearsal build

on:
  workflow_dispatch:
  push:
    branches: ['docs/wordpress-delivery-feasibility-2026-11-02', 'codex/first-operational-cycle-2026-11-12']
    paths:
      - 'proxy.ts'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'instrumentation.ts'
      - 'scripts/wordpress-rehearsal-artifact.mjs'
      - 'scripts/wordpress-artifact-links.mjs'
      - 'scripts/wordpress-private-server.cjs'
      - 'scripts/wordpress-routing-smoke.mjs'
      - 'tests/wordpress-private-server.test.mjs'
      - 'tests/wordpress-private-build-config.test.tsx'
      - 'tests/wordpress-artifact-links.test.mjs'
      - '.github/workflows/wordpress-rehearsal-build.yml'

permissions:
  contents: read

concurrency:
  group: wordpress-rehearsal-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Select protected Core build for manual dispatch
        run: |
          if [ "$GITHUB_REF_NAME" = codex/first-operational-cycle-2026-11-12 ]; then
            echo "MIOPAGES_PROTECTED_CORE=enabled" >> "$GITHUB_ENV"
          else
            echo "MIOPAGES_WP_PRIVATE_STAGE=enabled" >> "$GITHUB_ENV"
          fi
      - name: Reject production dependency advisories
        run: npm audit --omit=dev --audit-level=low
      - name: Verify retained approved rendering on Linux
        run: npx tsx --test tests/proposal-preview-compatibility.test.tsx tests/wordpress-private-build-config.test.tsx
      - name: Verify portable artifact dependency boundary
        run: node --test tests/wordpress-artifact-links.test.mjs
      - name: Verify raw routing boundary and sanitized diagnostics
        run: node --test tests/wordpress-private-server.test.mjs
      - name: Build without hosted credentials
        run: npm run build -- --webpack
        env:
          DATABASE_URL: postgresql://build:unused@127.0.0.1:1/build_only
          MIOPAGES_ROUTING_MODE: shared-hostnames
      - name: Prove isolated runtime and package checksummed artifact
        run: node scripts/wordpress-rehearsal-artifact.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'codex/first-operational-cycle-2026-11-12' && 'protected-core-linux-x64' || 'wordpress-rehearsal-linux-x64' }}
          path: |
            runtime-content/wordpress-rehearsal-artifact/*.tar.gz
            runtime-content/wordpress-rehearsal-artifact/*.sha256
            runtime-content/wordpress-rehearsal-artifact/rehearsal-build.json
          if-no-files-found: error
          retention-days: 7

