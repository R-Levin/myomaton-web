name: Approved public security release

on:
  push:
    branches: ['docs/wordpress-delivery-feasibility-2026-11-02']
    paths:
      - '.github/workflows/public-security-release.yml'
      - 'scripts/public-runtime-artifact.mjs'

permissions:
  contents: read

jobs:
  exact-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: operations
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 62439fc0c8bde7fe98339625d33a845102a7995a
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - run: npm ci && npm audit --omit=dev --audit-level=low && npm test
        working-directory: candidate
      - run: npm run build -- --webpack
        working-directory: candidate
        env:
          DATABASE_URL: postgresql://build:unused@127.0.0.1:1/build_only
          MIOPAGES_ROUTING_MODE: shared-hostnames
      - run: node ../operations/scripts/public-runtime-artifact.mjs
        working-directory: candidate
      - uses: actions/upload-artifact@v4
        with:
          name: public-security-62439fc-linux-x64
          path: |
            candidate/runtime-content/public-security-release/*.tar.gz
            candidate/runtime-content/public-security-release/*.sha256
            candidate/runtime-content/public-security-release/public-security-build.json
          if-no-files-found: error
          retention-days: 14
